name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Execute Statistical Analysis Notebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebooks/statistical_analysis.ipynb

      - name: Export HTML report
        run: |
          jupyter nbconvert --to html notebooks/statistical_analysis.ipynb --output-dir=reports --output=statistical_analysis.html

      - name: Verify generated artifacts
        run: |
          test -f reports/results_summary.csv || exit 1
          test -f reports/statistical_analysis.html || exit 1
          ls -la reports/figures/
